<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.35"/></filter>
  </defs>
  <rect width="1200" height="640" rx="24" fill="url(#bg)"/>
  <text x="600" y="54" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="700">How Health Check works</text>
  <text x="600" y="84" text-anchor="middle" fill="#94a3b8" font-size="16">Your watch data stays on your own Nextcloud. The AI only ever sees weekly aggregates.</text>

  <!-- column 1: phone -->
  <g filter="url(#sh)">
    <rect x="40" y="130" width="250" height="380" rx="20" fill="#111827" stroke="#334155"/>
  </g>
  <text x="165" y="168" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="700">⌚ Watch + iPhone</text>
  <text x="165" y="198" text-anchor="middle" fill="#cbd5e1" font-size="14">Any watch that writes</text>
  <text x="165" y="217" text-anchor="middle" fill="#cbd5e1" font-size="14">to Apple Health</text>
  <rect x="62" y="245" width="206" height="104" rx="12" fill="#1f2937"/>
  <text x="165" y="272" text-anchor="middle" fill="#fbbf24" font-size="15" font-weight="700">Weekly: Export.zip</text>
  <text x="165" y="296" text-anchor="middle" fill="#cbd5e1" font-size="13">Health → Export All Data</text>
  <text x="165" y="316" text-anchor="middle" fill="#cbd5e1" font-size="13">→ Save to Files → Nextcloud</text>
  <text x="165" y="336" text-anchor="middle" fill="#94a3b8" font-size="12">full history, sleep stages</text>
  <rect x="62" y="365" width="206" height="124" rx="12" fill="#1f2937"/>
  <text x="165" y="392" text-anchor="middle" fill="#34d399" font-size="15" font-weight="700">Daily: Shortcut push</text>
  <text x="165" y="416" text-anchor="middle" fill="#cbd5e1" font-size="13">runs when the alarm</text>
  <text x="165" y="435" text-anchor="middle" fill="#cbd5e1" font-size="13">is stopped, last 48 h</text>
  <text x="165" y="459" text-anchor="middle" fill="#94a3b8" font-size="12">personal token,</text>
  <text x="165" y="476" text-anchor="middle" fill="#94a3b8" font-size="12">only the SHA-256 is stored</text>

  <!-- column 2: nextcloud -->
  <g filter="url(#sh)">
    <rect x="370" y="130" width="440" height="380" rx="20" fill="#0b3b6e" stroke="#2563eb"/>
  </g>
  <text x="590" y="168" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="700">☁️ Nextcloud app "healthcheck"</text>
  <rect x="392" y="190" width="396" height="66" rx="12" fill="#0f4c8a"/>
  <text x="590" y="217" text-anchor="middle" fill="#e0f2fe" font-size="14" font-weight="700">Streaming import (XMLReader)</text>
  <text x="590" y="240" text-anchor="middle" fill="#bae6fd" font-size="13">~1 GB export in ~15 s · ~40 MB RAM · idempotent</text>
  <rect x="392" y="268" width="396" height="66" rx="12" fill="#0f4c8a"/>
  <text x="590" y="295" text-anchor="middle" fill="#e0f2fe" font-size="14" font-weight="700">One row per day and person</text>
  <text x="590" y="318" text-anchor="middle" fill="#bae6fd" font-size="13">sleep stages · HR · resting HR · SpO₂ · steps · weight</text>
  <rect x="392" y="346" width="190" height="146" rx="12" fill="#0f4c8a"/>
  <text x="487" y="372" text-anchor="middle" fill="#e0f2fe" font-size="14" font-weight="700">You see</text>
  <text x="487" y="396" text-anchor="middle" fill="#bae6fd" font-size="13">3 rings · trends</text>
  <text x="487" y="416" text-anchor="middle" fill="#bae6fd" font-size="13">weight · infographic</text>
  <text x="487" y="436" text-anchor="middle" fill="#bae6fd" font-size="13">early hints</text>
  <text x="487" y="456" text-anchor="middle" fill="#bae6fd" font-size="13">doctor report (A4)</text>
  <text x="487" y="476" text-anchor="middle" fill="#bae6fd" font-size="13">PWA + widget</text>
  <rect x="598" y="346" width="190" height="146" rx="12" fill="#0f4c8a"/>
  <text x="693" y="372" text-anchor="middle" fill="#e0f2fe" font-size="14" font-weight="700">Agent</text>
  <text x="693" y="396" text-anchor="middle" fill="#bae6fd" font-size="13">goals + weekly plan</text>
  <text x="693" y="416" text-anchor="middle" fill="#bae6fd" font-size="13">nudges · streaks</text>
  <text x="693" y="436" text-anchor="middle" fill="#bae6fd" font-size="13">"ask your data" chat</text>
  <text x="693" y="456" text-anchor="middle" fill="#bae6fd" font-size="13">correlations</text>
  <text x="693" y="476" text-anchor="middle" fill="#bae6fd" font-size="13">private calendar</text>

  <!-- column 3: n8n -->
  <g filter="url(#sh)">
    <rect x="890" y="130" width="270" height="380" rx="20" fill="#3b0d2e" stroke="#ea4b71"/>
  </g>
  <text x="1025" y="168" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="700">🤖 n8n weekly report</text>
  <text x="1025" y="198" text-anchor="middle" fill="#fbcfe8" font-size="14">Monday 07:00 + after</text>
  <text x="1025" y="217" text-anchor="middle" fill="#fbcfe8" font-size="14">each import (HMAC webhook)</text>
  <rect x="912" y="240" width="226" height="54" rx="12" fill="#4c1239"/>
  <text x="1025" y="262" text-anchor="middle" fill="#fde68a" font-size="13" font-weight="700">1 · GET aggregates only</text>
  <text x="1025" y="282" text-anchor="middle" fill="#fbcfe8" font-size="12">week vs 28-day baseline</text>
  <rect x="912" y="304" width="226" height="54" rx="12" fill="#4c1239"/>
  <text x="1025" y="326" text-anchor="middle" fill="#fde68a" font-size="13" font-weight="700">2 · AI (OpenAI-compatible)</text>
  <text x="1025" y="346" text-anchor="middle" fill="#fbcfe8" font-size="12">summary · 3 tips · plan</text>
  <rect x="912" y="368" width="226" height="54" rx="12" fill="#4c1239"/>
  <text x="1025" y="390" text-anchor="middle" fill="#fde68a" font-size="13" font-weight="700">3 · Report files</text>
  <text x="1025" y="410" text-anchor="middle" fill="#fbcfe8" font-size="12">/Health/Reports (.md, .html)</text>
  <rect x="912" y="432" width="226" height="54" rx="12" fill="#4c1239"/>
  <text x="1025" y="454" text-anchor="middle" fill="#fde68a" font-size="13" font-weight="700">4 · POST back to the app</text>
  <text x="1025" y="474" text-anchor="middle" fill="#fbcfe8" font-size="12">AI card + notification</text>

  <!-- arrows -->
  <path d="M290 297 L366 250" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#ar)"/>
  <path d="M290 427 L366 300" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#ar)"/>
  <path d="M810 230 L886 230" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#ar)"/>
  <path d="M886 460 L814 460" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#ar)"/>

  <text x="600" y="566" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="600">No cloud vendor, no tracking: data, files, calendar and reports live in your Nextcloud.</text>
  <text x="600" y="596" text-anchor="middle" fill="#94a3b8" font-size="14">Not a medical device. Hints compare you only with your own recent past and never diagnose.</text>
</svg>
